name: Website visual audit
on:
  push:
    branches: [main]
    paths:
      - 'qa/visual-audit.mjs'
      - '.github/workflows/visual-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dbso-visual-audit
  cancel-in-progress: true
jobs:
  screenshots:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - run: node qa/visual-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-audit-${{ github.run_id }}
          path: qa-output/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
